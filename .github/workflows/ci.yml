name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint, typecheck, bundle drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task typecheck
      # dist/brb.js is generated from the TypeScript source and committed (npx serves it).
      # Rebuild it and fail if the committed copy is stale.
      - run: deno task build:verify

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The CLI tests run the source on Deno and the shipped dist/brb.js on this Node version.
      - run: deno task test
